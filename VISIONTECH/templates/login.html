{% extends 'base.html' %}

{% block title %}Login | Overclock PC Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg bg-dark text-white">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 mb-2">Operator Login</h1>
                        <p class="text-muted">Enter your credentials to access the Gamer Panel and checkout flow.</p>
                    </div>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control bg-secondary text-white border-secondary" id="username" name="username" placeholder="Your username" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control bg-secondary text-white border-secondary" id="password" name="password" placeholder="Your password" required>
                        </div>
                        <button type="submit" class="btn btn-cyber w-100 py-3">Continue to verification</button>
                    </form>

                    <div class="text-center mt-4 text-muted">
                        New here? <a href="{% url 'register_view' %}" class="text-info text-decoration-none">Create an account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
