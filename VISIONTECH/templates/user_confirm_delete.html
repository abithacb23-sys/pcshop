{% extends 'base.html' %}
{% load static %}

{% block title %}Delete User | Overclock PC Shop{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-panel p-4 text-center">
                <h2>Delete User</h2>
                <p class="text-muted mb-4">Confirm deletion of the user <strong>{{ user.username }}</strong>. This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Delete User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
